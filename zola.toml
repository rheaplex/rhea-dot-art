  { name = "Furtherfield", src = "/third-party-logos/furtherfield_logo.png" },
  { name = "Kate Vass Galerie", src = "/third-party-logos/kvg_logo.png" },
  { name = "Galerie Nagel Draxler", src = "/third-party-logos/nagel-draxler-logo.png" },
  { name = "Sotheby's", src = "/third-party-logos/sothebys.png" },
]

