# Zola configuration for rhea.art
base_url = "https://rhea.art"
title = "Rhea Myers"
description = "Making code(s) into art"
default_language = "en"
compile_sass = false
minify_html = false
generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 20
build_search_index = false
exclude_paginated_pages_in_sitemap = "all"
skip_content_templating = ["blog/*", "writing/*", "about/*"]

taxonomies = [
  { name = "categories", paginate_by = 20 },
  { name = "tags", paginate_by = 20 },
]

[markdown]
smart_punctuation = false
external_links_external = false
bottom_footnotes = true
lazy_async_image = false

[link_checker]
internal_level = "warn"

[slugify]
paths = "safe"

[extra]
copyright = "Copyright © 2026 Myers Studio Ltd."

# Shown at the foot of any page that carries sales information (extra.purchase).
sales_disclaimer = "Prices, editions and availability are given for information only and were correct at the time of publication; they may change without notice and errors and omissions are excepted. Nothing on this page is an offer for sale. Prices exclude applicable taxes, fees and shipping. Any sale is subject to the terms of the gallery, platform and/or Myers Studio Ltd. as the seller."
subtitle = "Making code(s) into art"

menu = [
  { name = "Art", url = "/art/" },
  { name = "Exhibitions", url = "/exhibitions/" },
  { name = "Press", url = "/press/" },
  { name = "Publications", url = "/publications/" },
  { name = "Blog", url = "/blog/" },
  { name = "About", url = "/about/" },
]

# Home page "As seen with" logo strip.
logos = [
  { name = "Taschen", src = "/third-party-logos/taschen_logo.png", height = 28 },
