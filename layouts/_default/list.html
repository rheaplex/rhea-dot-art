{{ define "main" }}
  <header class="mb-4">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>
  {{ if not .IsHome }}
  <main>
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
      {{ range .Pages }}
        {{ partial "card" . }}
      {{ end }}
    </div>
  </main>
  {{ end }}
{{ end }}
