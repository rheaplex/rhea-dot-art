{{ define "main" }}
<article class="reading">
  <header class="mb-4">
    <h1>{{ .Title }}</h1>
    {{ if and (eq .Section "blog") (not .Date.IsZero) }}
    <p class="text-body-secondary"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
    {{ end }}
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
