{{ define "main" }}
<header class="mb-4">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</header>
<main class="reading reading-wide">
  {{ range .Pages.ByDate.Reverse.GroupByDate "2006" }}
  <h2 class="h6 text-body-secondary mt-4 mb-1">{{ .Key }}</h2>
  {{ range .Pages }}
    {{ partial "publication-line" . }}
  {{ end }}
  {{ end }}
</main>
{{ end }}
