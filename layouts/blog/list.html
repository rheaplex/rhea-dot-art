{{ define "main" }}
  <header class="mb-4">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>
  {{ $paginator := .Paginate .Pages }}
  <main class="reading">
    {{ range $paginator.Pages }}
    <article class="mb-5 pb-4 border-bottom">
      <h2 class="h3 mb-1"><a href="{{ .RelPermalink }}" class="link-body-emphasis text-decoration-none">{{ .Title }}</a></h2>
      <p class="text-body-secondary small mb-3"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
      <div class="content">
        {{ .Content }}
      </div>
    </article>
    {{ end }}
    {{ template "_internal/pagination.html" . }}
  </main>
{{ end }}
