{{ $page := . }}
<div class="container">
  <header class="d-flex flex-wrap justify-content-center align-items-center py-3 mb-4 border-bottom">
    <a href="{{ "/" | relURL }}" class="d-flex flex-column mb-3 mb-md-0 me-md-auto text-body text-decoration-none site-brand">
      <span class="fs-3 site-title">{{ .Site.Title }}</span>
      {{ with .Site.Params.subtitle }}<span class="text-body-secondary small">{{ . }}</span>{{ end }}
    </a>

    <nav aria-label="Main">
      <ul class="nav nav-underline">
        {{ range .Site.Menus.main }}
        {{ $active := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) (eq $page.Section (trim .URL "/")) }}
        <li class="nav-item">
          <a class="nav-link{{ if $active }} active{{ end }}" {{ if $active }}aria-current="page"{{ end }} href="{{ .URL | relURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </header>
</div>
