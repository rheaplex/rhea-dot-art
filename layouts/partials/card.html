{{/* Square thumbnail card for gallery grids. */}}
<div class="col">
  <a href="{{ .RelPermalink }}" class="card h-100 border-0 bg-transparent text-decoration-none artwork-card">
    {{ with .Params.image }}
      {{ with resources.Get . }}
        {{ $thumb := .Fill "600x600 TopLeft" }}
        <img src="{{ $thumb.RelPermalink }}" width="{{ $thumb.Width }}" height="{{ $thumb.Height }}" alt="{{ $.Title }}" class="card-img-top rounded-0" loading="lazy">
      {{ else }}
        <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="card-img-top rounded-0" loading="lazy">
      {{ end }}
    {{ end }}
    <div class="card-body px-0 pb-0 text-center">
      <h2 class="card-title h6 mb-1 text-body">{{ .Title }}</h2>
      {{ if not .Date.IsZero }}<p class="card-text text-body-secondary small mb-0">{{ .Date.Format "2006" }}</p>{{ end }}
    </div>
  </a>
</div>
