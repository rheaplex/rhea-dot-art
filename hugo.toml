baseURL = ''
relativeURLs = true
locale = 'en'
title = 'Rhea Myers'

staticDir = "assets"

[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      footnote = true
    [markup.goldmark.renderer]
      # Allow raw html in markdown
      unsafe = true

[params]
  copyright = "Copyright © 2026 Myers Studio Ltd."
  subtitle = "Making code(s) into art"

  # Home page "As seen with" logo strip.
  logos = [
    { name = "Taschen", src = "/third-party-logos/taschen_logo.png", height = 28 },
    { name = "Buffalo AKG Art Museum", src = "/third-party-logos/akg.png" },
    { name = "Feral File", src = "/third-party-logos/feralfile.png" },
    { name = "Foundation", src = "/third-party-logos/foundation.png" },
    { name = "Furtherfield", src = "/third-party-logos/furtherfield_logo.png" },
    { name = "Kate Vass Galerie", src = "/third-party-logos/kvg_logo.png" },
    { name = "Galerie Nagel Draxler", src = "/third-party-logos/nagel-draxler-logo.png" },
    { name = "Sotheby's", src = "/third-party-logos/sothebys.png" },
  ]

  [[params.social]]
    name = "newsletter"
    url = "/newsletter/"
  [[params.social]]
    name = "email"
    url = "mailto:rhea@myers.studio"
  [[params.social]]
    name = "bluesky"
    url = "https://bsky.app/profile/rhea.art"
  [[params.social]]
    name = "fedi"
    url = "https://social.rhea.art/@rheaplex"
  [[params.social]]
    name = "instagram"
    url = "https://www.instagram.com/rheapl3x/"
  [[params.social]]
    name = "linkedin"
    url = "https://ca.linkedin.com/in/rheamyers"
  [[params.social]]
    name = "twitter"
    url = "https://twitter.com/rheaplex"
  [[params.social]]
    name = "github"
    url = "https://github.com/rheaplex"

[permalinks]
  # Allow source to be organized but all pages to be top-level
  # Be careful to avoid name collisions.
  art = '/:filename/'
  writing = '/:filename/'
  about = '/:filename/'
  blog = '/:year/:month/:day/:slug/'

