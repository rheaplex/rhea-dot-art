baseURL = ''
relativeURLs = true
locale = 'en'
title = 'Rhea Myers'

staticDir = "assets"

[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      footnote = true
    [markup.goldmark.renderer]
      # Allow raw html in markdown
      unsafe = true

[params]
  copyright = "Copyright © 2026 Myers Studio Ltd."
  subtitle = "Making code(s) into art"

  [[params.social]]
    name = "newsletter"
    url = "/newsletter/"
  [[params.social]]
    name = "email"
    url = "mailto:rhea@myers.studio"
  [[params.social]]
    name = "bluesky"
    url = "https://bsky.app/profile/rhea.art"
  [[params.social]]
    name = "fedi"
    url = "https://social.rhea.art/@rheaplex"
  [[params.social]]
    name = "instagram"
    url = "https://www.instagram.com/rheapl3x/"
  [[params.social]]
    name = "linkedin"
    url = "https://ca.linkedin.com/in/rheamyers"
  [[params.social]]
    name = "twitter"
    url = "https://twitter.com/rheaplex"
  [[params.social]]
    name = "github"
    url = "https://github.com/rheaplex"

[permalinks]
  # Allow source to be organized but all pages to be top-level
  # Be careful to avoid name collisions.
  art = '/:filename/'
  writing = '/:filename/'
  about = '/:filename/'
  shows = '/:filename/'
  press = '/:filename/'
  blog = '/:year/:month/:day/:slug/'

[[menu.main]]
    name = "Art"
    url = "/art/"
    weight = 10

[[menu.main]]
    name = "Shows"
    url = "/shows/"
    weight = 20

[[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 30

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40
