{% extends "base.html" %}
{% block content %}
<article class="reading mx-auto">
  <header class="mb-4">
    <h1>{{ page.title }}</h1>
    {%- if page.date and page.ancestors | last != "about/_index.md" %}<p class="text-body-secondary">{{ page.date | date(format="%-d %B %Y") }}</p>{% endif %}
  </header>
  <div class="content">{{ page.content | safe }}</div>
</article>
{% endblock content %}
