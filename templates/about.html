{% extends "base.html" %}
{% block content %}
<header class="mb-4"><h1>{{ section.title }}</h1></header>
<div class="reading">
  {{ section.content | safe }}
  <ul class="list-unstyled">
    {%- for p in section.pages %}<li class="mb-2"><a href="{{ p.permalink | safe }}" class="link-body-emphasis">{{ p.title }}</a></li>{% endfor %}
  </ul>
</div>
{% endblock content %}
