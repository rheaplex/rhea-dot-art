{% extends "base.html" %}
{% block content %}
<h1 class="h-page mb-8">{{ taxonomy.name | title }}</h1>
<ul class="flex flex-wrap gap-x-5 gap-y-2">
  {%- for t in terms %}<li><a href="{{ t.permalink | safe }}" class="quiet">{{ t.name }}</a> <span class="label inline">{{ t.page_count }}</span></li>{% endfor %}
</ul>
{% endblock content %}
