{% extends "base.html" %}
{% block content %}
<h1 class="h-page mb-8">{{ section.title }}</h1>
{%- if section.content %}<div class="prose-site mb-10">{{ section.content | safe }}</div>{% endif %}
<ul class="prose-site">
  {%- for p in section.pages %}<li class="!mt-2"><a href="{{ p.permalink | safe }}" class="quiet">{{ p.title }}</a>{% if p.date %} <span class="text-muted">{{ p.date | date(format="%Y") }}</span>{% endif %}</li>{% endfor %}
</ul>
{% endblock content %}
